# Start everything:   docker compose up --build
# Then open:          http://localhost:8080/SkillSwap/
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: skillswap
      TZ: Asia/Kolkata
    # Every .sql file in ./sql runs once, in name order, the first time the
    # database volume is created (01 -> 02 -> 03).
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pskillswap"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/skillswap?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: root
      DB_PASSWORD: skillswap
      TZ: Asia/Kolkata
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
