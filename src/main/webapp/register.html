<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20c0-6 4-10 10-10" stroke="#D9971F" stroke-width="2" stroke-linecap="round"/>
          <path d="M28 12c0 6-4 10-10 10" stroke="#3F7A5C" stroke-width="2" stroke-linecap="round"/>
        </svg>
        SkillSwap
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline" style="border-color: var(--ink); color: var(--ink);">Log in</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <p class="eyebrow">Get started</p>
      <h1>Create your account</h1>
      <p class="sub">List what you can teach — you'll add the details on your profile next.</p>

      <form class="auth-form" id="registerForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Aisha Khan" autocomplete="name" />
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field password-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" />
          <button type="button" class="toggle-password" id="togglePassword">Show</button>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="field password-field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
          <button type="button" class="toggle-password" id="toggleConfirmPassword">Show</button>
          <span class="field-error" id="confirmPasswordError"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>

        <div class="form-message" id="formMessage"></div>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
