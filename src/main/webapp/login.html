<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20c0-6 4-10 10-10" stroke="#D9971F" stroke-width="2" stroke-linecap="round"/>
          <path d="M28 12c0 6-4 10-10 10" stroke="#3F7A5C" stroke-width="2" stroke-linecap="round"/>
        </svg>
        SkillSwap
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-primary">Sign up</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in to SkillSwap</h1>
      <p class="sub">Pick up where you left off with your swaps.</p>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field password-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="togglePassword">Show</button>
          <span class="field-error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>

        <div class="form-message" id="formMessage"></div>
      </form>

      <p class="auth-switch">New to SkillSwap? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
