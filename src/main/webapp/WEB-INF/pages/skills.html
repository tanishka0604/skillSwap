<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage skills — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/skills.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20c0-6 4-10 10-10" stroke="#D9971F" stroke-width="2" stroke-linecap="round"/>
          <path d="M28 12c0 6-4 10-10 10" stroke="#3F7A5C" stroke-width="2" stroke-linecap="round"/>
        </svg>
        SkillSwap
      </a>
      <div class="nav-actions">
        <a href="dashboard" class="btn btn-outline" style="border-color: var(--ink); color: var(--ink);">Dashboard</a>
        <a href="matches" class="btn btn-outline" style="border-color: var(--ink); color: var(--ink);">Matches</a>
        <a href="profile" class="btn btn-outline" style="border-color: var(--ink); color: var(--ink);">Profile</a>
        <a href="requests" class="btn btn-outline" style="border-color: var(--ink); color: var(--ink);">Requests</a>
        <a href="logout" class="btn btn-outline" style="border-color: var(--ink); color: var(--ink);">Log out</a>
      </div>
    </div>
  </header>

  <main class="container skills-page">
    <div class="page-head">
      <p class="eyebrow">Your skills</p>
      <h1>Manage what you teach and what you want to learn</h1>
      <p>These lists are what SkillSwap uses to find your matches later on.</p>
    </div>

    <form class="add-skill-form" id="addSkillForm">
      <div class="field">
        <label for="skillName">Skill name</label>
        <input type="text" id="skillName" name="name" placeholder="e.g. JavaScript" required />
      </div>

      <div class="field">
        <label for="skillCategory">Category</label>
        <select id="skillCategory" name="category" required>
          <option value="PROGRAMMING">Programming</option>
          <option value="DESIGN">Design</option>
          <option value="MUSIC">Music</option>
          <option value="PHOTOGRAPHY">Photography</option>
          <option value="LANGUAGES">Languages</option>
          <option value="MARKETING">Marketing</option>
          <option value="FITNESS">Fitness</option>
          <option value="ACADEMICS">Academics</option>
        </select>
      </div>

      <div class="field">
        <label for="skillType">I want to...</label>
        <select id="skillType" name="type" required>
          <option value="TEACH">Teach this</option>
          <option value="LEARN">Learn this</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Add skill</button>
    </form>

    <div class="form-message" id="formMessage" style="margin-top: 16px;"></div>

    <div class="skill-columns">
      <div class="skill-column">
        <h2>Skills I teach</h2>
        <ul class="skill-list" id="teachList"></ul>
      </div>
      <div class="skill-column">
        <h2>Skills I want to learn</h2>
        <ul class="skill-list" id="learnList"></ul>
      </div>
    </div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/skills.js"></script>
</body>
</html>
